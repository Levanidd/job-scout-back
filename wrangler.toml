name = "jobradar"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Assets are matched first; anything without a file match (i.e. /api/*) hits the Worker.
[assets]
directory = "./admin/dist"

[[d1_databases]]
binding = "DB"
database_name = "job-scout"
database_id = "111a2873-66df-4e82-850f-4b812282577e"

# Manual start: admin "Прогнать" → POST /api/run. Cron does not start a
# cycle; it only continues one that waitUntil dropped mid-walk.
[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "development"

# wrangler secret put:
# ADMIN_TOKEN
# GEMINI_API_KEY
# GEMINI_MODEL           (optional, defaults to gemini-3.7-flash)
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID
# ADZUNA_APP_ID          (optional)
# ADZUNA_APP_KEY         (optional)
