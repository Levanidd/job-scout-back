name = "jobradar"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "job-scout"
database_id = "111a2873-66df-4e82-850f-4b812282577e"

[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "development"

# wrangler secret put:
# ADMIN_TOKEN
# ANTHROPIC_API_KEY
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID
# ADZUNA_APP_ID          (optional)
# ADZUNA_APP_KEY         (optional)
