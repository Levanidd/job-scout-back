name = "jobradar"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# After `npx wrangler d1 create jobradar`, put the real database_id here.
[[d1_databases]]
binding = "DB"
database_name = "jobradar"
database_id = "00000000-0000-0000-0000-000000000001"

[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "development"

# wrangler secret put:
# ADMIN_TOKEN
# ANTHROPIC_API_KEY
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID
# ADZUNA_APP_ID          (optional)
# ADZUNA_APP_KEY         (optional)
