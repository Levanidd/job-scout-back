name = "jobradar"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Assets are matched first; anything without a file match (i.e. /api/*) hits the Worker.
# /api/* always runs the script so a self-tick cannot be swallowed by the asset router.
[assets]
directory = "./admin/dist"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "job-scout"
database_id = "111a2873-66df-4e82-850f-4b812282577e"

# Self-binding so cycle hops do not fetch the public workers.dev URL (Cloudflare 1042).
[[services]]
binding = "SELF"
service = "jobradar"

# Manual runs only: the admin "Прогнать" button hits POST /api/run, then the
# Worker chains /api/run/tick so the browser tab does not have to stay open.
[triggers]
crons = []

[vars]
ENVIRONMENT = "development"

# wrangler secret put:
# ADMIN_TOKEN
# GEMINI_API_KEY
# GEMINI_MODEL           (optional, defaults to gemini-3.7-flash)
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID
# ADZUNA_APP_ID          (optional)
# ADZUNA_APP_KEY         (optional)
